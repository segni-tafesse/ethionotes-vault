<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EthioNotes Vault</title>
  <script src="https://telegram.org"></script>
  <script src="https://jsdelivr.net"></script>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #10b981; --text: #f8fafc; --muted: #94a3b8; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; padding-bottom: 80px; }
    .hidden { display: none !important; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .badge { background: rgba(16,185,129,0.15); color: var(--accent); padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; }
    .hero-card { background: var(--card); border-radius: 16px; padding: 24px 18px; text-align: center; border: 1px solid #334155; margin-top: 20px; }
    .choice-btn { display: block; width: 100%; padding: 18px; border: none; border-radius: 14px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 14px; text-align: center; }
    .choice-buy { background: var(--accent); color: #052e16; }
    .choice-sell { background: #3b82f6; color: white; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab { flex: 1; padding: 11px; border: none; border-radius: 10px; background: var(--card); color: var(--muted); font-weight: bold; cursor: pointer; font-size: 13px; }
    .tab.active { background: var(--accent); color: #052e16; }
    .card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #334155; }
    .tag { display: inline-block; background: #334155; color: #38bdf8; font-size: 11px; padding: 3px 8px; border-radius: 6px; margin-right: 6px; font-weight: 600; }
    .tag-free { background: rgba(16,185,129,0.2); color: #34d399; }
    input, select { width: 100%; padding: 11px; margin: 6px 0 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 14px; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--accent); color: #052e16; font-weight: bold; font-size: 15px; cursor: pointer; }
    .btn-free { background: #3b82f6; color: white; }
  </style>
</head>
<body>

<div class="header">
  <div>
    <h2 style="margin:0;font-size:20px;">📚 EthioNotes Vault</h2>
    <small style="color:var(--muted);">Study Notes & Solved Exams 🇪🇹</small>
  </div>
  <div class="badge">🎉 FREE ACCESS</div>
</div>

<!-- WELCOME SCREEN -->
<div id="welcomeScreen" class="hero-card">
  <h3 style="margin:0 0 8px;font-size:22px;">What would you like to do?</h3>
  <p style="color:var(--muted);font-size:14px;margin:0 0 16px;">All notes & solved exams are currently <b>100% FREE</b>!</p>
  <button type="button" id="goBrowseBtn" class="choice-btn choice-buy">🔍 Find & Download Notes / Exams</button>
  <button type="button" id="goUploadBtn" class="choice-btn choice-sell">⬆️ Upload Study Notes / Exams</button>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="hidden">
  <div class="tabs">
    <button type="button" id="tabBrowse" class="tab">🔍 Browse</button>
    <button type="button" id="tabUpload" class="tab">⬆️ Upload PDF</button>
    <button type="button" id="tabWallet" class="tab">💰 Wallet</button>
  </div>

  <!-- BROWSE -->
  <div id="viewBrowse" class="hidden">
    <select id="uniFilter">
      <option value="">All Universities & Freshman Courses</option>
      <option>Freshman / Remedial (All Universities)</option>
      <option>Addis Ababa University (AAU)</option>
      <option>ASTU (Adama)</option>
      <option>AASTU</option>
      <option>Bahir Dar University</option>
      <option>Jimma University</option>
      <option>Hawassa University</option>
      <option>Mekelle University</option>
    </select>
    <input type="text" id="searchInput" placeholder="Search course or keyword..." />
    <div id="notesList"><p style="color:var(--muted);text-align:center;">Loading notes...</p></div>
  </div>

  <!-- UPLOAD -->
  <div id="viewUpload" class="hidden">
    <div class="card">
      <h3 style="margin-top:0;">Upload Study Note or Solved Exam</h3>
      <label>University / Level</label>
      <select id="upUni">
        <option>Freshman / Remedial (All Universities)</option>
        <option>Addis Ababa University (AAU)</option>
        <option>ASTU (Adama)</option>
        <option>AASTU</option>
        <option>Bahir Dar University</option>
        <option>Jimma University</option>
        <option>Hawassa University</option>
        <option>Mekelle University</option>
      </select>
      <label>Course Code / Subject</label>
      <input type="text" id="upCourse" placeholder="e.g. Phys 1011 / Applied Math I" />
      <label>Title</label>
      <input type="text" id="upTitle" placeholder="e.g. 2016 Midterm + Full Solutions" />
      <label>Future Price (Free during launch)</label>
      <select id="upPrice">
        <option value="0">0 ETB (Always Free)</option>
        <option value="20">20 ETB (Free now)</option>
        <option value="30" selected>30 ETB (Free now)</option>
        <option value="50">50 ETB (Free now)</option>
      </select>
      <label>Select PDF File</label>
      <input type="file" id="upFile" accept=".pdf,application/pdf" />
      <button type="button" id="publishBtn" class="btn">Publish PDF 🚀</button>
    </div>
  </div>

  <!-- WALLET -->
  <div id="viewWallet" class="hidden">
    <div class="card">
      <h3 style="margin-top:0;">Your Creator Wallet</h3>
      <p style="font-size:28px;font-weight:bold;color:var(--accent);margin:8px 0;">0.00 ETB</p>
      <p style="font-size:13px;color:var(--muted);">Save your Telebirr number for future payouts:</p>
      <input type="text" id="telebirrInput" placeholder="Enter Telebirr number (09...)" />
      <button type="button" id="savePhoneBtn" class="btn">Save Telebirr Number 💾</button>
    </div>
  </div>
</div>

<script>
window.addEventListener("DOMContentLoaded", function() {
  // PASTE YOUR SUPABASE PUBLISHABLE / ANON KEY HERE:
  var SUPABASE_URL = "https://supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_sDRw2ULepUszDnI_btVRjg_haxqU-r7";

  function showTab(name) {
    document.getElementById("welcomeScreen").classList.add("hidden");
    document.getElementById("mainApp").classList.remove("hidden");
    ["Browse", "Upload", "Wallet"].forEach(function(t) {
      document.getElementById("view" + t).classList.add("hidden");
      document.getElementById("tab" + t).classList.remove("active");
    });
    document.getElementById("view" + name).classList.remove("hidden");
    document.getElementById("tab" + name).classList.add("active");
  }

  document.getElementById("goBrowseBtn").onclick = function() { showTab("Browse"); };
  document.getElementById("goUploadBtn").onclick = function() { showTab("Upload"); };
  document.getElementById("tabBrowse").onclick = function() { showTab("Browse"); };
  document.getElementById("tabUpload").onclick = function() { showTab("Upload"); };
  document.getElementById("tabWallet").onclick = function() { showTab("Wallet"); };

  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  var tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : { id: "demo_user_1", first_name: "Student" };
  var userId = String(tgUser.id);
  var userName = tgUser.first_name || "Student";

  var db = null;
  if (window.supabase && SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY") {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  async function loadNotes() {
    if (!db) {
      document.getElementById("notesList").innerHTML = "<p style='color:#f59e0b;text-align:center;'>⚠️ Paste your SUPABASE_ANON_KEY in index.html first.</p>";
      return;
    }
    var q = document.getElementById("searchInput").value.toLowerCase();
    var uni = document.getElementById("uniFilter").value;
    var res = await db.from("notes").select("*").order("created_at", { ascending: false }).limit(200);
    var notes = res.data || [];
    var filtered = notes.filter(function(n) {
      var matchUni = !uni || n.university === uni;
      var matchSearch = n.university.toLowerCase().includes(q) || n.course_code.toLowerCase().includes(q) || n.title.toLowerCase().includes(q);
      return matchUni && matchSearch;
    });

    var list = document.getElementById("notesList");
    if (!filtered.length) {
      list.innerHTML = "<p style='color:#94a3b8;text-align:center;'>No notes uploaded yet. Tap Upload PDF to add the first one!</p>";
      return;
    }

    list.innerHTML = filtered.map(function(n) {
      return "<div class='card'>" +
        "<div><span class='tag'>" + n.university + "</span><span class='tag'>" + n.course_code + "</span><span class='tag tag-free'>FREE</span></div>" +
        "<h4 style='margin:8px 0 4px;'>" + n.title + "</h4>" +
        "<small style='color:#94a3b8;display:block;margin-bottom:10px;'>By " + n.uploader_name + "</small>" +
        "<a href='" + n.file_url + "' target='_blank' style='text-decoration:none;'><button type='button' class='btn btn-free'>Download Free PDF 📥</button></a>" +
      "</div>";
    }).join("");
  }

  document.getElementById("uniFilter").onchange = loadNotes;
  document.getElementById("searchInput").oninput = loadNotes;

  document.getElementById("publishBtn").onclick = async function() {
    if (!db) return alert("Paste your SUPABASE_ANON_KEY in index.html first!");
    var fileInput = document.getElementById("upFile");
    var file = fileInput.files && fileInput.files[0];
    var course = document.getElementById("upCourse").value.trim();
var title = document.getElementById("upTitle").value.trim();
var uni = document.getElementById("upUni").value;
var price = Number(document.getElementById("upPrice").value);
if (!file || !course || !title) return alert("Please fill all fields and select a PDF file!");
var btn = document.getElementById("publishBtn");
btn.disabled = true; btn.innerText = "Uploading...";
var fileName = userId + "_" + Date.now() + ".pdf";
var upRes = await db.storage.from("study_pdfs").upload(fileName, file);
if (upRes.error) {
btn.disabled = false; btn.innerText = "Publish PDF 🚀";
return alert("Upload error: " + upRes.error.message);
}
var pub = db.storage.from("study_pdfs").getPublicUrl(fileName);
var insRes = await db.from("notes").insert({
uploader_id: userId, uploader_name: userName, university: uni,
course_code: course, title: title, price_etb: price, file_url: pub.data.publicUrl
});
btn.disabled = false; btn.innerText = "Publish PDF 🚀";
if (insRes.error) return alert("Database error: " + insRes.error.message);
document.getElementById("upCourse").value = "";
document.getElementById("upTitle").value = "";
fileInput.value = "";
alert("✅ PDF Published!");
showTab("Browse");
loadNotes();
};
document.getElementById("savePhoneBtn").onclick = async function() {
if (!db) return;
var phone = document.getElementById("telebirrInput").value.trim();
if (!phone) return alert("Enter your Telebirr number!");
await db.from("vault_users").upsert({ telegram_id: userId, full_name: userName, telebirr_phone: phone });
alert("✅ Telebirr number saved!");
};
if (db) {
db.from("vault_users").upsert({ telegram_id: userId, full_name: userName }, { onConflict: "telegram_id", ignoreDuplicates: true }).then(loadNotes);
} else {
loadNotes();
}
});
